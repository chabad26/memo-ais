global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: linux
    metrics_path: /metrics
    static_configs:
      - targets: ['IP_DEBIAN:9100']
        labels:
          endpoint: debian
          os_family: linux

  - job_name: windows
    metrics_path: /metrics
    static_configs:
      - targets: ['IP_WINDOWS:9182']
        labels:
          endpoint: windows-core
          os_family: windows
