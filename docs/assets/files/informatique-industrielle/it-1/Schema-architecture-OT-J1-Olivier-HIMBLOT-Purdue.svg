-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="52" dy="0">NIVEAU 1</tspan></text><text x="52" y="933" fill="#24527c" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400"><tspan x="52" dy="0">Contrôle local</tspan></text><rect x="460" y="921" width="360" height="114" rx="5" fill="#ffffff" stroke="#849db7" stroke-width="1.5" /><rect x="476" y="940" width="42" height="36" rx="2" fill="#ffffff" stroke="#42668e" stroke-width="1.5" /><rect x="481" y="946" width="4" height="5" rx="0" fill="#008477" stroke="#008477" stroke-width="1.5" /><rect x="489" y="946" width="4" height="5" rx="0" fill="#008477" stroke="#008477" stroke-width="1.5" /><rect x="497" y="946" width="4" height="5" rx="0" fill="#008477" stroke="#008477" stroke-width="1.5" /><rect x="505" y="946" width="4" height="5" rx="0" fill="#008477" stroke="#008477" stroke-width="1.5" /><rect x="482" y="959" width="30" height="9" rx="0" fill="#ecf3fa" stroke="#42668e" stroke-width="1.5" /><text x="535" y="952" fill="#20364d" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700"><tspan x="535" dy="0">Contrôleur simulé</tspan></text><text x="535" y="979" fill="#20364d" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400"><tspan x="535" dy="0">lab.server / Plant</tspan><tspan x="535" dy="21.0">Modbus TCP : 15020</tspan><tspan x="535" dy="21.0">Hystérésis + défaut + alarme</tspan></text><polyline points="407,811 407,851 550,851 550,921" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#blue)" marker-start="url(#blue)" /><text x="260" y="865" fill="#2563a6" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="260" dy="0">Modbus TCP : lecture</tspan></text><polyline points="861,774 861,848 750,848 750,921" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#blue)" marker-start="url(#blue)" /><text x="884" y="827" fill="#2563a6" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="884" dy="0">Modbus TCP</tspan></text><text x="846" y="863" fill="#2563a6" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400"><tspan x="846" dy="0">Écritures de paramètres</tspan></text><rect x="35" y="1110" width="1030" height="263" rx="8" fill="#edf7f3" stroke="#59a997" stroke-width="1.5" /><text x="52" y="1137" fill="#08776b" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="52" dy="0">NIVEAU 0</tspan></text><text x="52" y="1163" fill="#08776b" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400"><tspan x="52" dy="0">Procédé, capteur</tspan><tspan x="52" dy="21.0">et actionneur</tspan></text><rect x="250" y="1144" width="310" height="80" rx="5" fill="#ffffff" stroke="#849db7" stroke-width="1.5" /><rect x="281" y="1163" width="10" height="27" rx="3" fill="#ffffff" stroke="#008477" stroke-width="1.5" /><rect x="277" y="1186" width="18" height="15" rx="7" fill="#dcf2ec" stroke="#008477" stroke-width="1.5" /><text x="325" y="1175" fill="#20364d" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700"><tspan x="325" dy="0">Capteur simulé</tspan></text><text x="325" y="1202" fill="#20364d" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400"><tspan x="325" dy="0">Température Plant.temp</tspan></text><rect x="250" y="1261" width="310" height="80" rx="5" fill="#ffffff" stroke="#849db7" stroke-width="1.5" /><rect x="266" y="1280" width="40" height="38" rx="1" fill="#ffffff" stroke="#008477" stroke-width="1.5" /><rect x="272" y="1285" width="28" height="25" rx="0" fill="#edf7f3" stroke="#008477" stroke-width="1.5" /><rect x="296" y="1297" width="3" height="6" rx="0" fill="#008477" stroke="#008477" stroke-width="1.5" /><text x="325" y="1292" fill="#20364d" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700"><tspan x="325" dy="0">Enceinte froide</tspan></text><text x="325" y="1319" fill="#20364d" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400"><tspan x="325" dy="0">Ambiance / porte</tspan><tspan x="325" dy="21.0">Évolution thermique</tspan></text><rect x="741" y="1261" width="287" height="80" rx="5" fill="#ffffff" stroke="#849db7" stroke-width="1.5" /><rect x="757" y="1285" width="34" height="28" rx="6" fill="#ffffff" stroke="#008477" stroke-width="1.5" /><rect x="791" y="1294" width="8" height="10" rx="0" fill="#008477" stroke="#008477" stroke-width="1.5" /><text x="765" y="1302" fill="#008477" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700"><tspan x="765" dy="0">M</tspan></text><text x="816" y="1292" fill="#20364d" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700"><tspan x="816" dy="0">Compresseur</tspan></text><text x="816" y="1319" fill="#20364d" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400"><tspan x="816" dy="0">Marche / arrêt simulés</tspan></text><polyline points="405,1144 405,1090 640,1090 640,1035" fill="none" stroke="#66788a" stroke-width="2" marker-end="url(#gray)" /><text x="660" y="1099" fill="#66788a" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="660" dy="0">Mesure interne</tspan></text><polyline points="405,1261 405,1224" fill="none" stroke="#66788a" stroke-width="2" marker-end="url(#gray)" /><text x="426" y="1247" fill="#66788a" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="426" dy="0">Température</tspan></text><polyline points="820,994 1048,994 1048,1301 1028,1301" fill="none" stroke="#b26b14" stroke-width="2" marker-end="url(#orange)" stroke-dasharray="8 5" /><text x="872" y="1021" fill="#b26b14" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="872" dy="0">Commande</tspan></text><polyline points="741,1301 560,1301" fill="none" stroke="#008477" stroke-width="3" marker-end="url(#teal)" /><text x="573" y="1288" fill="#008477" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="573" dy="0">Refroidissement</tspan></text><text x="35" y="1411" fill="#20364d" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700"><tspan x="35" dy="0">LECTURE DU SCHÉMA</tspan></text><text x="35" y="1437" fill="#52677d" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="35" dy="0">Bleu : HTTP / Modbus TCP (requêtes-réponses). Gris : données internes.</tspan><tspan x="35" dy="19.599999999999998">Orange pointillé : commande. Vert épais : effet thermique simulé.</tspan></text><text x="35" y="1484" fill="#52677d" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="35" dy="0">Les niveaux 0 et 1 sont regroupés dans le même processus Python. Aucun PLC matériel.</tspan><tspan x="35" dy="19.599999999999998">Les bandes grisées sont des repères non documentés, sans liaison inventée vers le laboratoire.</tspan></text><text x="35" y="1529" fill="#52677d" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400"><tspan x="35" dy="0">OpenPLC et FUXA ont été explorés séparément ; aucune connexion au procédé n’est attestée.</tspan></text><text x="35" y="1548" fill="#52677d" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="400"><tspan x="35" dy="0">Sources : laboratoire ot-refrigeration-poc ; repérage Purdue : Cisco Industrial Security 3.1, chap. 2.</tspan></text></svg>