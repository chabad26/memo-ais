<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1555" viewBox="0 0 1100 1555"><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563a6" /></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66788a" /></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b26b14" /></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#008477" /></marker></defs><rect x="0" y="0" width="1100" height="1555" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" /><rect x="0" y="0" width="1100" height="126" rx="0" fill="#153653" stroke="#153653" stroke-width="1.5" /><text x="35" y="49" fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700"><tspan x="35" dy="0">Installation frigorifique — architecture OT</tspan></text><text x="35" y="83" fill="#dbeaf5" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400"><tspan x="35" dy="0">Lecture par niveaux Purdue • Laboratoire Python/Modbus • J1</tspan></text><text x="35" y="112" fill="#dbeaf5" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400"><tspan x="35" dy="0">Olivier HIMBLOT | AIS 2026 | Grenoble | 26 octobre 2026</tspan></text><text x="35" y="160" fill="#52677d" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400"><tspan x="35" dy="0">Placement fonctionnel pédagogique : ce n’est pas une segmentation réseau déployée.</tspan></text><rect x="35" y="187" width="1030" height="78" rx="8" fill="#f5f6f8" stroke="#c6ccd4" stroke-width="1.5" /><text x="52" y="211" fill="#77818f" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="52" dy="0">NIVEAU 5</tspan></text><text x="252" y="214" fill="#697481" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700"><tspan x="252" dy="0">SI entreprise / accès externes</tspan></text><text x="252" y="240" fill="#77818f" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="252" dy="0">Internet, accès distant de tiers : non décrits dans le laboratoire.</tspan></text><rect x="35" y="281" width="1030" height="78" rx="8" fill="#f5f6f8" stroke="#c6ccd4" stroke-width="1.5" /><text x="52" y="305" fill="#77818f" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="52" dy="0">NIVEAU 4</tspan></text><text x="252" y="308" fill="#697481" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700"><tspan x="252" dy="0">Gestion métier du site</tspan></text><text x="252" y="334" fill="#77818f" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="252" dy="0">ERP / logistique : aucune liaison documentée.</tspan></text><rect x="35" y="375" width="1030" height="78" rx="8" fill="#f5f6f8" stroke="#c6ccd4" stroke-width="1.5" /><text x="52" y="399" fill="#77818f" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="52" dy="0">DMZ INDUSTRIELLE</tspan></text><text x="252" y="402" fill="#697481" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700"><tspan x="252" dy="0">Zone industrielle intermédiaire</tspan></text><text x="252" y="428" fill="#77818f" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="252" dy="0">Souvent notée 3.5 ; aucun bastion ou pare-feu déployé attesté.</tspan></text><rect x="35" y="469" width="1030" height="78" rx="8" fill="#f5f6f8" stroke="#c6ccd4" stroke-width="1.5" /><text x="52" y="493" fill="#77818f" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700"><tspan x="52" dy="0">NIVEAU 3</tspan></text><text x="252" y="496" fill="#697481" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700"><tspan x="252" dy="0">Opérations du site</tspan></text><text x="252" y="522" fill="#77818f" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400"><tspan x="252" dy="0">MES / historian : aucun service dédié documenté.</tspan></text><rect x="35" y="582" width="1030" height="246" rx="8" fill="#edf4fb" stroke="#5f8fbd" stroke-width="1.5" /><text x="52" y="609" fill="#24527c" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700"><tspan x="52" dy="0">NIVEAU 2</tspan></text><text x="52" y="635" fill="#24527c" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400"><tspan x="52" dy="0">Supervision</tspan><tspan x="52" dy="21.0">et maintenance</tspan></text><rect x="250" y="631" width="315" height="83" rx="5" fill="#ffffff" stroke="#849db7" stroke-width="1.5" /><rect x="266" y="650" width="40" height="27" rx="2" fill="#ffffff" stroke="#42668e" stroke-width="1.5" /><rect x="283" y="677" width="6" height="7" rx="0" fill="#42668e" stroke="#42668e" stroke-width="1.5" /><rect x="274" y="684" width="24" height="3" rx="0" fill="#42668e" stroke="#42668e" stroke-width="1.5" /><text x="325" y="662" fill="#20364d" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700"><tspan x="325" dy="0">Poste opérateur</tspan></text><text x="325" y="689" fill="#20364d" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400"><tspan x="325" dy="0">Navigateur web</tspan></text><rect x="250" y="744" width="315" height="67" rx="5" fill="#ffffff" stroke="#849db7" stroke-width="1.5" /><rect x="266" y="763" width="40" height="10" rx="1" fill="#ffffff" stroke="#42668e" stroke-width="1.5" /><rect x="271" y="766" width="4" height="4" rx="1" fill="#008477" stroke="#008477" stroke-width="1.5" /><rect x=