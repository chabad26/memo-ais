t-size="16" fill="#18354c"><tspan x="612" dy="0">REG-02 — Modbus TCP 502</tspan><tspan x="612" dy="23">Aucune authentification, support terminé</tspan><tspan x="612" dy="23">Pas de correctif ni remplacement immédiat</tspan></text><rect x="1180" y="965" width="390" height="95" rx="8" fill="#edf6f3" stroke="#38718a" stroke-width="1.5"/><text x="1192" y="992" font-family="Arial,sans-serif" font-size="16" fill="#18354c"><tspan x="1192" dy="0">ZF-02 : sonde / porte / groupe</tspan><tspan x="1192" dy="23">Régulation et avertissement locaux</tspan><tspan x="1192" dy="23">Comportement de sortie à confirmer</tspan></text><path d="M230 295 L230 495" fill="none" stroke="#245b83" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="245" y="369" font-family="Arial,sans-serif" font-size="14" fill="#18354c" font-weight="normal"><tspan x="245" dy="0">Accès contrôlé</tspan></text><path d="M775 295 L775 520" fill="none" stroke="#245b83" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="795" y="364" font-family="Arial,sans-serif" font-size="14" fill="#18354c" font-weight="normal"><tspan x="795" dy="0">Q10 — consultation via GW</tspan><tspan x="795" dy="21">Pas de direct SUP → REG-02</tspan></text><path d="M395 545 L475 545 L475 780 L1375 780 L1375 650" fill="none" stroke="#245b83" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="1080" y="809" font-family="Arial,sans-serif" font-size="14" fill="#18354c" font-weight="normal"><tspan x="1080" dy="0">Q12 — maintenance bornée</tspan><tspan x="1080" dy="21">Fermeture / révocation des sessions</tspan></text><path d="M795 620 L795 965" fill="none" stroke="#245b83" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="1010" y="864" font-family="Arial,sans-serif" font-size="14" fill="#18354c" font-weight="normal"><tspan x="1010" dy="0">Q11 — GW-02 → REG-02 (TCP 502)</tspan></text><path d="M1260 650 L1260 845 L960 845 L960 965" fill="none" stroke="#245b83" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M1010 1010 L1180 1010" fill="none" stroke="#245b83" stroke-width="2" marker-end="url(#arrow)"/><text x="1030" y="1054" font-family="Arial,sans-serif" font-size="14" fill="#18354c" font-weight="normal"><tspan x="1030" dy="0">Terrain local</tspan><tspan x="1030" dy="21">Technologie inconnue</tspan></text><text x="30" y="716" font-family="Arial,sans-serif" font-size="16" fill="#18354c" font-weight="bold"><tspan x="30" dy="0">IT, STOCK, ORDER, BACKUP, fournisseurs,</tspan><tspan x="30" dy="23">MAINT-01, SUP-01 et bastion :</tspan><tspan x="30" dy="23">direct vers REG-02 REFUSÉ (Q00).</tspan><tspan x="30" dy="23">Pas de pont ou bypass permissif.</tspan></text><text x="30" y="1131" font-family="Arial,sans-serif" font-size="16" fill="#18354c" font-weight="normal"><tspan x="30" dy="0">GW-02 unique sur le dessin : deux rôles applicatifs, pas deux régulateurs. Son réseau d’administration est à définir.</tspan><tspan x="30" dy="23">Panne GW : collecte/maintenance dégradées ; contrôle local attendu si indépendant, à qualifier. Aucun bypass automatique.</tspan><tspan x="30" dy="23">Hypothèse d’architecture : aucune règle chargée, capacité de passerelle et résilience non testées.</tspan></text></svg>